# =============================================================================
# Deploy MCP Server to Azure Container Apps
# =============================================================================
# Triggered on push to develop/main. Builds Docker image on ThinkPad runner,
# pushes to ACR, deploys to existing Container Apps environment.
# =============================================================================

name: Deploy MCP Server

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

concurrency:
  group: mcp-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP_DEV: rg-serendiggity-dev
  ACR_NAME: serendiggityacr
  CONTAINER_APP_NAME_DEV: ca-mcp-dev
  CONTAINER_ENV_NAME: cae-serendiggity-dev
  IMAGE_NAME: serendiggity-mcp

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: [self-hosted, linux, x64]
    needs: build
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        env:
          RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP_DEV }}
          CONTAINER_APP: ${{ env.CONTAINER_APP_NAME_DEV }}
          CONTAINER_ENV: ${{ env.CONTAINER_ENV_NAME }}
          IMAGE: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:develop
        run: |
          SHORT_SUFFIX=$(echo "${{ github.sha }}" | cut -c1-8 | tr '[:upper:]' '[:lower:]')
          REVISION_NAME="${CONTAINER_APP}--${SHORT_SUFFIX}"

          # ---- CRITICAL: Enforce single-revision mode ----
          # This prevents the idle-revision billing bug that cost $1,602!
          # ONLY one revision ever runs. No ghost revisions charging us while idle.
          az containerapp revision set-mode \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --mode single \
            --output none 2>/dev/null || true

          # Scale to exactly 1 replica min/max — never 0 (we need it always-on for MCP),
          # never more than 1 (no parallel idle billing).
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --min-replicas 1 \
            --max-replicas 1 \
            --output none 2>/dev/null || true

          echo "Deploying image: $IMAGE"
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "$SHORT_SUFFIX" \
            --output none

          echo "Waiting for revision to activate..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp revision show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "properties.runningState" \
              --output tsv 2>/dev/null || echo "unknown")
            echo "  Attempt $i: $STATUS"
            if [ "$STATUS" = "Running" ]; then
              echo "✅ MCP Server deployed and running!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              echo "❌ Revision failed to start!"
              exit 1
            fi
            sleep 10
          done
          echo "⏱️ Timed out waiting for activation — check logs manually"
          exit 1

      - name: Verify deployment
        run: |
          sleep 10
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME_DEV }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_DEV }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || echo "pending")
          echo "MCP Server FQDN: https://${FQDN}"
